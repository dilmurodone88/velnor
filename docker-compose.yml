# Lokal ishga tushirish:  docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: itservice
      MYSQL_USER: itservice
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-itservice_pass}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["${MYSQL_PORT:-3307}:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: mysql://itservice:${MYSQL_PASSWORD:-itservice_pass}@mysql:3306/itservice
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: runner }
    image: velnor/it-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://itservice:${MYSQL_PASSWORD:-itservice_pass}@mysql:3306/itservice
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3005}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports: ["${WEB_PORT:-3005}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  mysql_data:
