apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: it-service
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: velnor/it-service-migrator:latest
          envFrom: [{ secretRef: { name: app-secrets } }]
